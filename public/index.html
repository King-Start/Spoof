<!DOCTYPE html>
<html>
<head>
    <title>🦁 SirLion Spoof</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:sans-serif;background:#0a0a0a;color:#fff;padding:20px}
        .container{max-width:600px;margin:0 auto}
        header{text-align:center;padding:20px 0}
        h1{background:linear-gradient(45deg,#f7971e,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        section{background:rgba(255,255,255,0.05);border-radius:10px;padding:20px;margin-bottom:20px}
        input,button{width:100%;padding:12px;margin:5px 0;border-radius:5px;border:none}
        input{background:rgba(255,255,255,0.05);color:#fff;border:1px solid rgba(255,255,255,0.1)}
        button{background:linear-gradient(45deg,#f7971e,#ffd200);font-weight:bold;cursor:pointer}
        .result{padding:15px;background:rgba(0,255,0,0.1);border-radius:10px;margin-top:10px}
        .hidden{display:none}
        .loading{padding:20px;text-align:center}
        .spinner{width:30px;height:30px;border:3px solid #333;border-top:3px solid #f7971e;border-radius:50%;margin:10px auto;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="container">
    <header><h1>🦁 SirLion Spoof</h1><p>Instant Approve!</p></header>

    <section>
        <h2>🔑 API Key</h2>
        <input type="password" id="apiKey" placeholder="API Key Roblox">
        <input type="text" id="userId" placeholder="User ID">
        <button onclick="saveKey()">💾 Simpan</button>
        <div id="status"></div>
    </section>

    <section>
        <h2>🎵 Spoof & Upload</h2>
        <input type="text" id="assetId" placeholder="Masukkan ID audio">
        <button onclick="spoofAndUpload()">🚀 Spoof & Upload</button>
        <div id="loading" class="hidden"><div class="spinner"></div><p>Processing...</p></div>
        <div id="result" class="result hidden"></div>
    </section>

    <section>
        <h2>📜 Generate Script</h2>
        <input type="text" id="scriptId" placeholder="ID hasil spoof">
        <button onclick="generateScript()">📝 Generate</button>
        <div id="scriptOutput" class="result hidden"><pre id="scriptCode"></pre></div>
    </section>
</div>
<script>
function saveKey(){
    const key=document.getElementById('apiKey').value,uid=document.getElementById('userId').value;
    if(!key||!uid)return alert('Isi semua!');
    localStorage.setItem('key',key);localStorage.setItem('uid',uid);
    document.getElementById('status').innerHTML='✅ Tersimpan';
}

function spoofAndUpload(){
    const id=document.getElementById('assetId').value.trim();
    if(!id)return alert('Masukkan ID!');
    const key=localStorage.getItem('key'),uid=localStorage.getItem('uid');
    if(!key||!uid)return alert('Simpan API Key dulu!');
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('result').classList.add('hidden');
    
    fetch('/api/spoof-and-upload',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':key,'x-user-id':uid},
        body:JSON.stringify({assetId:id})
    })
    .then(r=>r.json())
    .then(d=>{
        document.getElementById('loading').classList.add('hidden');
        if(d.success){
            document.getElementById('result').innerHTML=`
                ✅ Upload Berhasil! ⚡ INSTANT APPROVE!
                <br>🎵 Nama: ${d.name}
                <br>🆔 ID Baru: <strong>${d.newAssetId}</strong>
                <br>📦 Ukuran: ${d.size}
                <br><button onclick="copyId('${d.newAssetId}')">📋 Copy ID</button>
                <br><button onclick="document.getElementById('scriptId').value='${d.newAssetId}';generateScript()">🎵 Generate Script</button>
            `;
            document.getElementById('result').classList.remove('hidden');
        } else {
            document.getElementById('result').innerHTML=`
                ❌ Gagal: ${d.error}
                <br>💡 Coba ID lain atau cek API Key.
            `;
            document.getElementById('result').classList.remove('hidden');
        }
    })
    .catch(e=>{
        document.getElementById('loading').classList.add('hidden');
        alert('❌ Error: '+e.message);
    });
}

function copyId(id){navigator.clipboard.writeText(id);alert('✅ ID: '+id);}

function generateScript(){
    const id=document.getElementById('scriptId').value.trim();
    if(!id)return alert('Masukkan ID!');
    fetch('/api/generate-script',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({musicId:id,volume:1,loop:true,useAC6:false})
    })
    .then(r=>r.json())
    .then(d=>{
        document.getElementById('scriptOutput').innerHTML=`<pre>${d.script}</pre>`;
        document.getElementById('scriptOutput').classList.remove('hidden');
    });
}
</script>
</body>
</html>
